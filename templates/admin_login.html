<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso Administrador | Control de Rifa Benéfica</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-base: #0B1120;
            --bg-surface: #111827;
            --bg-card: #1E293B;
            --border: #334155;
            --text-primary: #F8FAFC;
            --text-muted: #94A3B8;
            --accent-gold: #F59E0B;
            --accent-cyan: #0EA5E9;
            --accent-red: #EF4444;
            --radius-md: 12px;
            --radius-lg: 18px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-base);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            position: relative;
            overflow: hidden;
        }

        /* Fondo ambiental brillante */
        body::before {
            content: '';
            position: absolute;
            width: 480px;
            height: 480px;
            background: radial-gradient(circle, rgba(245, 158, 11, 0.12) 0%, rgba(14, 165, 233, 0.06) 50%, transparent 70%);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 0;
            pointer-events: none;
        }

        .login-card {
            position: relative;
            z-index: 1;
            background: rgba(30, 41, 59, 0.85);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: var(--radius-lg);
            width: 100%;
            max-width: 420px;
            padding: 36px 30px;
            box-shadow: 0 20px 45px rgba(0, 0, 0, 0.5), 0 0 25px rgba(245, 158, 11, 0.1);
            text-align: center;
        }

        .shield-icon-box {
            width: 64px;
            height: 64px;
            margin: 0 auto 18px;
            background: linear-gradient(135deg, rgba(245, 158, 11, 0.2) 0%, rgba(14, 165, 233, 0.2) 100%);
            border: 1px solid rgba(245, 158, 11, 0.4);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            box-shadow: 0 0 20px rgba(245, 158, 11, 0.25);
        }

        .login-badge {
            display: inline-block;
            font-size: 11px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--accent-gold);
            background: rgba(245, 158, 11, 0.12);
            border: 1px solid rgba(245, 158, 11, 0.3);
            padding: 3px 10px;
            border-radius: 20px;
            margin-bottom: 10px;
        }

        .login-title {
            font-size: 22px;
            font-weight: 800;
            color: #FFFFFF;
            margin-bottom: 6px;
        }

        .login-subtitle {
            font-size: 13px;
            color: var(--text-muted);
            margin-bottom: 24px;
            line-height: 1.4;
        }

        .error-banner {
            background: rgba(239, 68, 68, 0.15);
            border: 1px solid rgba(239, 68, 68, 0.4);
            color: #FCA5A5;
            padding: 10px 14px;
            border-radius: var(--radius-md);
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 8px;
            text-align: left;
        }

        .form-group {
            margin-bottom: 20px;
            text-align: left;
        }

        .form-label {
            display: block;
            font-size: 12px;
            font-weight: 700;
            color: var(--text-muted);
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .input-wrap {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-icon {
            position: absolute;
            left: 14px;
            font-size: 16px;
            color: var(--text-muted);
            pointer-events: none;
        }

        .password-input {
            width: 100%;
            background: #0B1120;
            border: 1px solid var(--border);
            color: #FFFFFF;
            font-family: 'JetBrains Mono', monospace;
            font-size: 18px;
            font-weight: 700;
            letter-spacing: 3px;
            padding: 12px 45px 12px 42px;
            border-radius: var(--radius-md);
            transition: all 0.2s ease;
        }

        .password-input:focus {
            outline: none;
            border-color: var(--accent-gold);
            box-shadow: 0 0 16px rgba(245, 158, 11, 0.35);
        }

        .toggle-btn {
            position: absolute;
            right: 12px;
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 18px;
            cursor: pointer;
            padding: 4px;
            transition: color 0.15s;
        }

        .toggle-btn:hover {
            color: #FFFFFF;
        }

        .btn-submit {
            width: 100%;
            background: linear-gradient(135deg, #F59E0B 0%, #D97706 100%);
            color: #04111D;
            border: none;
            font-size: 15px;
            font-weight: 800;
            padding: 14px 20px;
            border-radius: var(--radius-md);
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 14px rgba(245, 158, 11, 0.35);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(245, 158, 11, 0.5);
            filter: brightness(1.1);
        }

        .btn-submit:active {
            transform: translateY(0);
        }

        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            margin-top: 22px;
            color: var(--text-muted);
            text-decoration: none;
            font-size: 13px;
            font-weight: 600;
            transition: color 0.2s;
        }

        .back-link:hover {
            color: var(--accent-cyan);
        }
    </style>
</head>
<body>

    <div class="login-card">
        <div class="shield-icon-box">
            🛡️
        </div>

        <div class="login-badge">Acceso de Seguridad</div>
        <h1 class="login-title">Panel Organizador</h1>
        <p class="login-subtitle">
            Control de Rifa Benéfica &bull; Cirugía de Cataratas<br>
            Ingresa la clave para acceder al tablero de gestión.
        </p>

        {% if error %}
        <div class="error-banner">
            <span>⚠️</span>
            <span>{{ error }}</span>
        </div>
        {% endif %}

        <form action="/admin/login" method="POST" autocomplete="off">
            <div class="form-group">
                <label class="form-label" for="txtClave">Clave de Seguridad</label>
                <div class="input-wrap">
                    <span class="input-icon">🔒</span>
                    <input 
                        type="password" 
                        id="txtClave" 
                        name="clave" 
                        class="password-input" 
                        placeholder="•••••••••" 
                        required 
                        autofocus
                    >
                    <button type="button" class="toggle-btn" onclick="togglePassword()" title="Mostrar/ocultar clave">
                        <span id="eyeIcon">👁️</span>
                    </button>
                </div>
            </div>

            <button type="submit" class="btn-submit">
                <span>🔓</span> Ingresar al Panel
            </button>
        </form>

        <a href="/" class="back-link">
            <span>←</span> Volver a la Rifa Pública
        </a>
    </div>

    <script>
        function togglePassword() {
            const input = document.getElementById('txtClave');
            const icon = document.getElementById('eyeIcon');
            if (input.type === 'password') {
                input.type = 'text';
                icon.innerText = '🙈';
            } else {
                input.type = 'password';
                icon.innerText = '👁️';
            }
        }
    </script>
</body>
</html>
